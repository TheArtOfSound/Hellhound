services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hellhound
      POSTGRES_PASSWORD: hellhound
      POSTGRES_DB: hellhound
    ports:
      - "54329:5432"
    volumes:
      - hellhound_pg:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  agent:
    image: node:22
    working_dir: /app
    command: bash -lc "npm install && npm run dev"
    ports:
      - "18888:8788"
    environment:
      PORT: 8788
      DATABASE_URL: postgres://hellhound:hellhound@postgres:5432/hellhound
      HELLHOUND_SANDBOX_URL: http://sandbox:8790
      HELLHOUND_ANSWER_KEY: ${HELLHOUND_ANSWER_KEY}
      HELLHOUND_SEARCH_KEY: ${HELLHOUND_SEARCH_KEY}
    volumes:
      - ./services/hellhound-agent:/app
    depends_on:
      - postgres
      - sandbox

  sandbox:
    image: node:22
    working_dir: /app
    command: bash -lc "npm install && npm run dev"
    ports:
      - "8790:8790"
    environment:
      PORT: 8790
    volumes:
      - ./services/hellhound-sandbox:/app

volumes:
  hellhound_pg:
